name: Build And Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: esp32
            firmware_name: fsd-controller-esp32.bin
            ota_name: fsd-controller-esp32-ota.bin
            full_name: fsd-controller-esp32-full.bin
            flash_size: 4MB
          - pio_env: esp32c3
            firmware_name: fsd-controller-esp32c3.bin
            ota_name: fsd-controller-esp32c3-ota.bin
            full_name: fsd-controller-esp32c3-full.bin
            flash_size: 4MB
          - pio_env: esp32s3
            firmware_name: fsd-controller-esp32s3.bin
            ota_name: fsd-controller-esp32s3-ota.bin
            full_name: fsd-controller-esp32s3-full.bin
            flash_size: 8MB
          - pio_env: esp32c6
            firmware_name: fsd-controller-esp32c6.bin
            ota_name: fsd-controller-esp32c6-ota.bin
            full_name: fsd-controller-esp32c6-full.bin
            flash_size: 8MB
          - pio_env: esp32c5
            firmware_name: fsd-controller-esp32c5.bin
            ota_name: fsd-controller-esp32c5-ota.bin
            full_name: fsd-controller-esp32c5-full.bin
            flash_size: 16MB
    env:
      APP_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e "${{ matrix.pio_env }}"

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          python3 tools/package_firmware.py \
            --build-dir ".pio/build/${{ matrix.pio_env }}" \
            --app-bin "${{ matrix.firmware_name }}" \
            --ota-name "${{ matrix.ota_name }}" \
            --full-name "${{ matrix.full_name }}" \
            --flash-size "${{ matrix.flash_size }}" \
            --output-dir dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.pio_env }}-${{ github.sha }}
          path: |
            dist/${{ matrix.ota_name }}
            dist/${{ matrix.full_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create Or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fsd-controller-esp32-ota.bin
            dist/fsd-controller-esp32-full.bin
            dist/fsd-controller-esp32c3-ota.bin
            dist/fsd-controller-esp32c3-full.bin
            dist/fsd-controller-esp32s3-ota.bin
            dist/fsd-controller-esp32s3-full.bin
            dist/fsd-controller-esp32c6-ota.bin
            dist/fsd-controller-esp32c6-full.bin
            dist/fsd-controller-esp32c5-ota.bin
            dist/fsd-controller-esp32c5-full.bin
          generate_release_notes: true
